<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>StandMode</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <main class="stand" id="stand" aria-label="StandMode">
    <section class="panel clock-panel" aria-label="Orologio">
      <div class="clock" id="clock">
        <svg class="clock-face" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <clipPath id="clockClip">
              <rect x="0" y="0" width="200" height="200" rx="42" ry="42" />
            </clipPath>
          </defs>
          <rect class="clock-bg" x="0" y="0" width="200" height="200" rx="42" ry="42" />
          <g class="ticks" id="ticks"></g>
          <g class="nums" id="nums"></g>
          <g class="hands">
            <g id="hourHand">
              <rect x="95.5" y="52" width="9" height="56" rx="4.5" fill="#ffffff" />
            </g>
            <g id="minuteHand">
              <rect x="95.5" y="30" width="9" height="78" rx="4.5" fill="#ffffff" />
            </g>
            <g id="secondHand">
              <line x1="100" y1="124" x2="100" y2="24" stroke="#c59a63" stroke-width="2" stroke-linecap="round" />
            </g>
            <circle class="hub-outer" cx="100" cy="100" r="5.8" fill="#c59a63" />
            <circle class="hub-inner" cx="100" cy="100" r="2.3" fill="#2a2116" />
          </g>
        </svg>
      </div>
    </section>

    <section class="panel date-panel" aria-label="Data">
      <div class="date-top">
        <span class="date-weekday" id="weekday">Lun</span>
        <span class="date-month-short" id="monthShort">Nov</span>
      </div>
      <div class="date-day" id="dayNum">2</div>
    </section>

    <section class="panel cal-panel" aria-label="Calendario">
      <div class="cal" id="calendar">
        <div class="cal-title" id="calTitle">NOVEMBRE</div>
        <div class="cal-weekdays" id="calWeekdays"></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
